# Base PostgreSQL de la app (solo en tu compu). Los datos quedan en el volumen gastos-db.
# iniciar.cmd la levanta sola; a mano: docker compose up -d
services:
  db:
    image: postgres:17
    # Arranca sola cada vez que se abre Docker Desktop
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos_local
    ports:
      - "5432:5432"
    volumes:
      - gastos-db:/var/lib/postgresql/data

volumes:
  gastos-db:
