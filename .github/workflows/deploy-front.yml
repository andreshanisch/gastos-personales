name: Publicar front

# Publica la PWA en GitHub Pages cada vez que cambia el front en main
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-front.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Verificar URL de la API
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Falta la variable VITE_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /gastos-personales/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
